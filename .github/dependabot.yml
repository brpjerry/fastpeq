# Dependabot keeps the three dependency surfaces current: the npm frontend/tooling,
# the Cargo workspace, and the GitHub Actions used by CI/release.
#
# Minor + patch updates are grouped into a single PR per ecosystem to keep noise
# down; major updates (e.g. vite 6→8, vitest 3→4, typescript 5→6) come as their
# own PRs so each can be reviewed and tested in isolation.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # `vite-plus` and the `vite` alias to `@voidzero-dev/vite-plus-core` (in
      # devDependencies and overrides) must stay on the same version, and the
      # `vitest` override must match the Vitest that `vite-plus` bundles
      # (`npx vp toolchain vitest`). If an update leaves them out of step,
      # re-pin them all with
      # `npx --package=vite-plus@<version> vp migrate --no-interactive`.
      # Listed first so it wins over npm-minor-patch.
      vite-plus:
        patterns:
          - "vite-plus"
          - "@voidzero-dev/vite-plus-core"
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "cargo"
    directory: "/" # workspace root; covers src-tauri + crates/*
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # `windows` and `windows-core` must stay on the same version (the COM
      # macros in src-tauri/src/audio.rs break otherwise; see src-tauri/Cargo.toml),
      # so every update to either comes as one PR. Listed first so it wins over
      # cargo-minor-patch.
      windows-rs:
        patterns:
          - "windows"
          - "windows-core"
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
