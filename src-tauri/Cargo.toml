[package]
name = "fastpeq"
version = "0.11.0"
description = "fastpeq — a fast Equalizer APO preset manager"
authors = ["fastpeq contributors"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the `fastpeq` binary
# (a Windows-specific cargo constraint).
name = "fastpeq_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastpeq-core = { path = "../crates/fastpeq-core" }
# Hardware parametric-EQ device drivers (USB HID) — the I/O half of EQ offload.
fastpeq-hw = { path = "../crates/fastpeq-hw" }

# Win32 API access (audio endpoints and default-device switching in `audio.rs`,
# the OSD overlay's virtual-desktop handling in `lib.rs`). The bindings are
# generated by `windows-bindgen` into `src/win32.rs` and checked in (see
# crates/win32-bindgen), so the app depends only on `windows-core`, not on the
# `windows` umbrella crate. Tauri still pulls in its own `windows`
# transitively; our code doesn't use that copy. `windows-core` also provides the
# `#[implement]` macro (IMMNotificationClient) and the `#[interface]` macro
# (the undocumented IPolicyConfig, which isn't in the Windows metadata, so
# `audio.rs` declares it by hand).
#
# Keep `windows-core` on the same version as `windows-bindgen` in
# crates/win32-bindgen/Cargo.toml: the generated code calls `windows-core`
# internals that only the matching `windows-bindgen` release targets. After
# bumping both, regenerate with
# `FASTPEQ_BLESS_BINDINGS=1 cargo test -p fastpeq-win32-bindgen`.
[target.'cfg(windows)'.dependencies]
windows-core = "0.100"
